<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibliothèque de la famille Katambayi</title>
<meta name="description" content="Retrouvez facilement les livres de la bibliothèque de la famille Katambayi.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0e4;--ink:#2a1c13;--mut:#7a6a5b;--gold:#b8893b;--card:#fffaf0;--bd:#e6dac4;--wood:#2a1c13;--bad:#a63a2b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif}
.hero{background:radial-gradient(1200px 400px at 50% -10%,#6b4528 0,transparent 70%),linear-gradient(#2a1c13,#3b2616);color:#f6e9cf;text-align:center;padding:52px 18px 70px}
.hero small{letter-spacing:.35em;font-size:.72rem;color:var(--gold);text-transform:uppercase}
.hero h1{font:700 clamp(1.9rem,6vw,3.4rem)/1.1 "Cormorant Garamond",serif;margin:10px 0 6px;letter-spacing:.04em;text-transform:uppercase}
.hero h1 span{display:block;color:var(--gold)}
.hero p{margin:6px auto 0;max-width:520px;color:#d8c6a4}
.orn{width:90px;height:2px;margin:16px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.stats{display:flex;justify-content:center;gap:28px;margin-top:22px}
.stats b{display:block;font:700 1.8rem "Cormorant Garamond",serif;color:#fff}.stats i{font-style:normal;font-size:.75rem;color:var(--gold);letter-spacing:.12em;text-transform:uppercase}
.wrap{max-width:1000px;margin:-34px auto 0;padding:0 14px 60px}
.search{display:flex;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px;box-shadow:0 10px 30px rgba(42,28,19,.18)}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:1.05rem;padding:10px 12px;outline:0;color:var(--ink);min-width:0}
.search select{border:0;background:#efe4cc;border-radius:10px;font:inherit;padding:0 10px;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 6px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--ink);color:#f6e9cf;border-color:var(--ink)}
.info{color:var(--mut);font-size:.88rem;margin:10px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.bk{display:flex;gap:12px;position:relative;background:var(--card);border:1px solid var(--bd);border-left:7px solid var(--c);border-radius:10px 14px 14px 10px;padding:13px 14px 12px;box-shadow:0 2px 0 rgba(42,28,19,.05);transition:.15s}
.bk:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(42,28,19,.12)}
.tx{min-width:0;flex:1}.th{width:62px;height:88px;object-fit:cover;border-radius:6px;cursor:zoom-in;flex:none;box-shadow:0 2px 6px rgba(42,28,19,.3)}.pv{max-height:120px;border-radius:8px;margin-top:8px;display:none}
.bk h3{margin:0;font:700 1.18rem/1.2 "Cormorant Garamond",serif}
.bk .au{color:var(--mut);font-size:.9rem;margin-top:3px}
.bk .lo{display:inline-block;margin-top:9px;font-size:.76rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--c);color:#fff}
.bk .nt{font-size:.78rem;color:var(--mut);margin-left:6px}
.ed{position:absolute;top:8px;right:8px;border:0;background:#efe4cc;border-radius:8px;padding:4px 9px;cursor:pointer;font-size:.8rem}
.more,.btn{border:0;background:var(--ink);color:#f6e9cf;font:inherit;font-weight:600;padding:11px 20px;border-radius:12px;cursor:pointer}
.btn.g{background:var(--gold)}.btn.o{background:transparent;color:var(--ink);border:1px solid var(--bd)}.btn.r{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.more{display:block;margin:22px auto}
.empty{text-align:center;color:var(--mut);padding:40px 0}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:0 0 28px}
footer button{background:none;border:0;color:var(--mut);cursor:pointer;text-decoration:underline;font:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#f6e9cf;padding:10px 14px;display:none;gap:10px;align-items:center;justify-content:center;z-index:9;flex-wrap:wrap}
body.adm .bar{display:flex}
dialog{border:0;border-radius:18px;padding:20px;width:min(92vw,460px);background:var(--card);color:var(--ink)}dialog::backdrop{background:rgba(20,10,5,.6)}
dialog h2{font:700 1.5rem "Cormorant Garamond",serif;margin:0 0 6px}
label{display:block;font-size:.8rem;color:var(--mut);margin:12px 0 4px}
dialog input,dialog select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px;margin-top:16px}.msg{color:var(--bad);font-size:.88rem;min-height:1.2em;margin-top:8px}
</style></head><body>
<header class="hero"><small>Foyer &amp; foi · Savoir &amp; transmission</small>
<h1>Bibliothèque<span>de la famille Katambayi</span></h1><div class="orn"></div>
<p>Retrouvez en un instant l’emplacement de chaque livre de notre maison.</p>
<div class="stats"><div><b id="s1">–</b><i>Livres</i></div><div><b id="s2">–</b><i>Auteurs</i></div><div><b id="s3">–</b><i>Rayons</i></div></div></header>
<main class="wrap">
<div class="search"><input id="q" type="search" placeholder="Titre, auteur ou thème…" autocomplete="off"><select id="so"><option value="t">Titre A–Z</option><option value="a">Auteur A–Z</option><option value="l">Rayon</option></select></div>
<div class="chips" id="ch"></div><div class="info" id="in"></div>
<div class="grid" id="gr"></div><button class="more" id="mo" hidden>Voir plus</button>
</main>
<footer>Bibliothèque de la famille Katambayi · <button id="lg">Administration</button></footer>
<div class="bar"><span id="dc"></span><button class="btn g" id="pb">Publier</button><button class="btn o" id="ad" style="color:#f6e9cf;border-color:#6b4528">+ Ajouter</button><button class="btn o" id="ex" style="color:#f6e9cf;border-color:#6b4528">Quitter</button></div>
<dialog id="d"><h2 id="dt"></h2><label>Titre *</label><input id="ft"><label>Auteur</label><input id="fa"><label>Rayon / emplacement</label><select id="fl"></select><input id="fl2" placeholder="Nouvel emplacement" style="display:none;margin-top:6px"><label>Remarque</label><input id="fn"><label>Photo de couverture</label><input id="fp" type="file" accept="image/*"><img id="pv" class="pv" alt=""><button class="btn r" id="rp" type="button" style="display:none;margin-top:8px">Retirer la photo</button><div class="msg" id="m"></div>
<div class="row"><button class="btn" id="sv" style="flex:1">Enregistrer</button><button class="btn o" id="cx">Annuler</button><button class="btn r" id="dl">Supprimer</button></div></dialog>
<dialog id="d3"><img id="big" alt="" style="width:100%;border-radius:10px"><div class="row"><button class="btn o" id="c3" style="flex:1">Fermer</button></div></dialog>
<dialog id="d2"><h2>Administration</h2><label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password"><div class="msg" id="m2"></div><div class="row"><button class="btn" id="go" style="flex:1">Se connecter</button><button class="btn o" id="c2">Annuler</button></div></dialog>
<script>
const $=i=>document.getElementById(i);
let curP="",books=[],chip="",shown=60,adm=false,api=true,pw="",dirty=0,edId=null;
const norm=s=>(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const short=l=>(l||"Sans rayon").split(" (")[0];
const hue=l=>{let h=0;for(const c of l||"")h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 38% 36%)`};
const locs=()=>[...new Set(books.map(b=>b.l).filter(Boolean))].sort();
function draw(){
  const q=norm($("q").value).split(/\s+/).filter(Boolean),k=$("so").value;
  const out=books.filter(b=>(!chip||b.l===chip)&&q.every(w=>norm(b.t+" "+b.a).includes(w)));
  out.sort((x,y)=>norm(x[k]||"~").localeCompare(norm(y[k]||"~"))||norm(x.t).localeCompare(norm(y.t)));
  $("in").textContent=out.length+" livre"+(out.length>1?"s":"")+(q.length||chip?" trouvé"+(out.length>1?"s":""):"");
  const g=$("gr");g.textContent="";
  if(!out.length){g.innerHTML='<div class="empty">Aucun livre trouvé. Essayez un autre mot.</div>'}
  out.slice(0,shown).forEach(b=>{
    const e=document.createElement("article");e.className="bk";e.style.setProperty("--c",hue(b.l));
    const h=document.createElement("h3");h.textContent=b.t;
    const a=document.createElement("div");a.className="au";a.textContent=b.a||"Auteur non renseigné";
    const l=document.createElement("span");l.className="lo";l.textContent=short(b.l);l.title=b.l||"";
    const w=document.createElement("div");w.className="tx";w.append(h,a,l);
    if(b.n){const n=document.createElement("span");n.className="nt";n.textContent=b.n;w.append(n)}
    if(b.p){const im=document.createElement("img");im.className="th";im.src=b.p;im.alt="Couverture";im.loading="lazy";im.onclick=()=>{$("big").src=b.p;$("d3").showModal()};e.append(im)}
    e.append(w);
    if(adm){const x=document.createElement("button");x.className="ed";x.textContent="Modifier";x.onclick=()=>openD(b);e.append(x)}
    g.append(e)});
  $("mo").hidden=out.length<=shown;
}
function stats(){$("s1").textContent=books.length;$("s2").textContent=new Set(books.map(b=>norm(b.a)).filter(Boolean)).size;$("s3").textContent=locs().length;
  const c=$("ch");c.textContent="";[["","Tous"],...locs().map(l=>[l,short(l)])].forEach(([v,t])=>{const b=document.createElement("button");b.className="chip"+(chip===v?" on":"");b.textContent=t;b.onclick=()=>{chip=v;shown=60;stats();draw()};c.append(b)})}
function fillSel(){$("fl").innerHTML=locs().map(l=>`<option value="${l.replace(/"/g,"&quot;")}">${l.replace(/</g,"&lt;")}</option>`).join("")+'<option value="__new">+ Nouvel emplacement…</option>'}
function openD(b){edId=b?b.id:null;$("dt").textContent=b?"Modifier le livre":"Ajouter un livre";fillSel();
  $("ft").value=b?b.t:"";$("fa").value=b?b.a:"";$("fn").value=b?b.n:"";$("fl").value=b&&b.l?b.l:(chip||"__new");$("fl2").value="";
  $("fl2").style.display=$("fl").value=="__new"?"block":"none";$("dl").style.display=b?"":"none";$("m").textContent="";setP(b&&b.p||"");$("fp").value="";$("d").showModal()}
function setP(v){curP=v;$("pv").src=v;$("pv").style.display=v?"block":"none";$("rp").style.display=v?"":"none"}
function shrink(f){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const i=new Image();i.onerror=ko;i.onload=()=>{const s=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.78))};i.src=r.result};r.readAsDataURL(f)})}
$("fp").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{setP(await shrink(f))}catch(x){$("m").textContent="Photo illisible, essayez une autre image."}};
$("rp").onclick=()=>{setP("");$("fp").value=""};
$("c3").onclick=()=>$("d3").close();
function touch(){dirty++;$("dc").textContent=dirty+" modification(s) non publiée(s)";try{localStorage.setItem("draft",JSON.stringify(books))}catch(e){}stats();draw()}
$("fl").onchange=()=>$("fl2").style.display=$("fl").value=="__new"?"block":"none";
$("sv").onclick=()=>{const t=$("ft").value.trim();if(!t){$("m").textContent="Le titre est obligatoire.";return}
  const l=$("fl").value=="__new"?$("fl2").value.trim():$("fl").value,o={t,a:$("fa").value.trim(),l,n:$("fn").value.trim(),p:curP};
  if(edId)books=books.map(b=>b.id==edId?{...b,...o}:b);else books.unshift({id:"n"+Date.now(),...o});
  $("d").close();touch()};
$("dl").onclick=()=>{if(confirm("Supprimer ce livre ?")){books=books.filter(b=>b.id!=edId);$("d").close();touch()}};
$("cx").onclick=()=>$("d").close();$("ad").onclick=()=>openD(null);
$("lg").onclick=()=>{$("m2").textContent="";$("pw").value="";$("d2").showModal()};$("c2").onclick=()=>$("d2").close();
$("go").onclick=async()=>{pw=$("pw").value;
  try{const r=await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw,check:true})});
    if(r.status==401){$("m2").textContent="Mot de passe incorrect.";return}
    if(!r.ok){throw 0}api=true}catch(e){if(!confirm("Serveur d’administration non configuré. Continuer en mode local (modifications exportées dans un fichier books.json) ?"))return;api=false}
  adm=true;document.body.classList.add("adm");$("d2").close();draw()};
$("ex").onclick=()=>{if(dirty&&!confirm("Des modifications ne sont pas publiées. Quitter quand même ?"))return;location.reload()};
$("pb").onclick=async()=>{
  if(!api){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(books)],{type:"application/json"}));a.download="books.json";a.click();alert("Remplacez books.json dans votre dépôt GitHub par ce fichier : le site se mettra à jour tout seul.");return}
  $("pb").textContent="Publication…";
  try{const r=await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw,books})});const j=await r.json();
    if(!r.ok)throw new Error(j.error);if(j.books)books=j.books;dirty=0;stats();draw();$("dc").textContent="Publié ✓ (visible dans environ 1 minute)"}
  catch(e){alert("Échec : "+e.message)}$("pb").textContent="Publier"};
$("q").oninput=()=>{shown=60;draw()};$("so").onchange=draw;$("mo").onclick=()=>{shown+=60;draw()};
fetch("books.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{books=d;stats();draw()}).catch(()=>$("in").textContent="Impossible de charger la liste des livres.");
</script></body></html>
